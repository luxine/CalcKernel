name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CALCKERNEL_TS_ROOT: ${{ github.workspace }}/typescript-oracle

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: luxine/CalcKernel
          ref: 5e989939d89d75056e5f3bea25f3bf7204d5529a
          path: typescript-oracle
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: corepack enable
      - run: corepack prepare pnpm@9.15.9 --activate
      - run: pnpm install --frozen-lockfile
        working-directory: typescript-oracle
      - run: pnpm build
        working-directory: typescript-oracle
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: ./target/release/ckc --help
      - run: ./target/release/ckc check examples/scalar.ck
      - run: ./target/release/ckc emit-mir examples/scalar.ck -O3
