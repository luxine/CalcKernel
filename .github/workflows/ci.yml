name: CI

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      performance_diagnostics:
        description: "Record same-worker pinned v0.11/v0.10 diagnostics without changing performance gates"
        type: boolean
        required: false
        default: false
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: quality (no native toolchain)
    runs-on: ubuntu-24.04
    env:
      CALCKERNEL_TS_ROOT: ${{ github.workspace }}/tests/oracles/typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify exact checkout SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.19.5
      - run: corepack enable
      - run: corepack prepare pnpm@9.15.9 --activate
      - run: sha256sum --check SOURCE_MANIFEST.sha256
        working-directory: tests/oracles/typescript
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: tests/oracles/typescript
      - run: pnpm build
        working-directory: tests/oracles/typescript
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Gate performance schemas and mutation contracts without LLVM
        run: cargo test --locked --test performance -- --nocapture
      - name: Gate independent fail-closed performance checkers
        run: python3 -B -m unittest discover -s tests/performance -p '*_test.py'
      - name: Gate the exact ten-job CI contract
        run: cargo test --locked --test contracts ci_ -- --nocapture
      - run: cargo test --locked
      - name: Reject false pass preservation in the release verifier
        run: cargo test --release --locked --lib verifier_cache_
      - name: Require release documentation inputs
        run: test -s docs/project/release-checklist.md && test -s docs/guides/performance.md && test -s docs/zh-CN/guides/performance.md
      - run: cargo build --release --locked
      - run: ./target/release/ckc --help
      - run: ./target/release/ckc check examples/core/scalar.ck
      - run: ./target/release/ckc emit-mir examples/core/scalar.ck -O3
      - name: Smoke feature-disabled backends
        run: |
          ./target/release/ckc emit-c examples/applications/pricing.ck --out build/pricing.c --header build/pricing.h
          ./target/release/ckc emit-wasm examples/wasm/scalar.ck --out build/scalar.wasm

  native-integration:
    name: native integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify exact checkout SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - name: Bootstrap pinned oracle toolchain
        uses: ./.github/actions/bootstrap-ckc-llvm
        with:
          target: x86_64-unknown-linux-gnu
          profile: oracle
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked
      - name: Execute real profile generation runtime paths
        run: cargo test --all-features --locked --test native profile_generation_ -- --nocapture
      - name: Verify profile runtime object and LLVM void-call behavior
        run: |
          cargo test --all-features --locked --test native profile_runtime_ -- --nocapture
          cargo test --all-features --locked --test native named_void_call_ -- --nocapture
      - name: Verify host-resolved multiversion artifact paths
        run: cargo test --all-features --locked --test cli multiversion_build_should_commit_the_verified_stage09_artifact_bundle -- --nocapture
      - name: Execute canonical raw-shard merge paths
        run: cargo test --all-features --locked --test profile profile_merge_ -- --nocapture
      - name: Execute real generate, merge, profile-use, and final artifact transaction
        run: cargo test --all-features --locked --test cli pgo_build_use_should_train_validate_and_commit_profile_and_artifact_together -- --nocapture
      - run: cargo build --release --features native-toolchain --locked
      - name: Build native audit fixtures
        run: cargo test --all-features --locked --test native artifacts
      - name: Build final 0.13 native audit fixture closure
        run: cargo test --all-features --locked --test native native_final_acceptance_set_should_include_private_runtime_closure
      - name: Audit native artifacts and dependencies
        run: |
          scripts/audit-native-artifact.sh target/native-acceptance
          scripts/audit-native-artifact.sh target/native-acceptance/v0.13-final
      - name: Audit JIT memory permissions
        run: scripts/audit-jit-memory.sh target/release/ckc
      - name: Test bridge ownership under ASan and UBSan
        run: scripts/test-sanitized-ownership.sh

  native-hosts:
    name: native host (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            target: aarch64-apple-darwin
            runner: macos-15
            executable: target/release/ckc
          - name: darwin-x64
            target: x86_64-apple-darwin
            runner: macos-15-intel
            executable: target/release/ckc
          - name: linux-arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            executable: target/release/ckc
          - name: linux-x64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            executable: target/release/ckc
          - name: win32-arm64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            executable: target/release/ckc.exe
          - name: win32-x64
            target: x86_64-pc-windows-msvc
            runner: windows-2025
            executable: target/release/ckc.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify exact checkout SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0
      - name: Bootstrap pinned host oracle
        uses: ./.github/actions/bootstrap-ckc-llvm
        with:
          target: ${{ matrix.target }}
          profile: oracle
      - name: Record pre-LLVM fact audit evidence
        run: |
          mkdir -p target/fact-audit
          cargo test --all-features --locked --test native fact_audit_ -- --nocapture 2>&1 | tee 'target/fact-audit/${{ matrix.name }}.log'
      - name: Upload pre-LLVM fact audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fact-audit-${{ matrix.name }}
          path: target/fact-audit/${{ matrix.name }}.log
          if-no-files-found: error
      - name: Run required native suite
        id: native-suite
        env:
          RUST_BACKTRACE: 1
        run: cargo test --all-features --locked --test native -- --nocapture
      - name: Record target, fallback, detector, and named-object capability evidence
        run: |
          mkdir -p target/capability
          cargo test --all-features --locked --test native variant_feature_target_profiles_should_be_explicit_and_contained -- --nocapture 2>&1 | tee 'target/capability/${{ matrix.name }}.log'
          cargo test --all-features --locked --test native multiversion_dispatch_ -- --nocapture 2>&1 | tee -a 'target/capability/${{ matrix.name }}.log'
          cargo test --all-features --locked --test native multiversion_artifact_ -- --nocapture 2>&1 | tee -a 'target/capability/${{ matrix.name }}.log'
          cargo test --all-features --locked --test native profile_runtime_ -- --nocapture 2>&1 | tee -a 'target/capability/${{ matrix.name }}.log'
          cargo test --all-features --locked --test native profile_generation_ -- --nocapture 2>&1 | tee -a 'target/capability/${{ matrix.name }}.log'
          cargo test --all-features --locked --test native named_void_call_ -- --nocapture 2>&1 | tee -a 'target/capability/${{ matrix.name }}.log'
          cargo test --all-features --locked --test cli multiversion_build_should_commit_the_verified_stage09_artifact_bundle -- --nocapture 2>&1 | tee -a 'target/capability/${{ matrix.name }}.log'
      - name: Upload host capability contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capability-${{ matrix.name }}
          path: target/capability/${{ matrix.name }}.log
          if-no-files-found: error
      - name: Diagnose failed Darwin native suite
        if: failure() && runner.os == 'macOS' && steps.native-suite.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 15
        run: bash scripts/diagnose-native-darwin.sh target/native-diagnostics
      - name: Upload Darwin native crash diagnostics
        if: always() && runner.os == 'macOS' && steps.native-suite.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-diagnostics-${{ matrix.name }}
          path: target/native-diagnostics
          if-no-files-found: error
      - run: cargo test --all-features --locked --test cli
      - name: Build release compiler on Unix
        if: runner.os != 'Windows'
        run: cargo build --release --features native-toolchain --locked
      - name: Build release compiler with static Windows CRT
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --features native-toolchain --locked
      - name: Sign the actual Darwin compiler before release audits
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - --options runtime \
            --entitlements native/macos/ckc-jit.entitlements.plist '${{ matrix.executable }}'
      - name: Audit release compiler dependencies on Unix
        if: runner.os != 'Windows'
        run: scripts/audit-ckc-release.sh '${{ matrix.executable }}'
      - name: Audit release compiler dependencies on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/audit-ckc-release.ps1 -Path '${{ matrix.executable }}'
      - name: Audit native artifacts on Unix
        if: runner.os != 'Windows'
        run: scripts/audit-native-artifact.sh target/native-acceptance
      - name: Audit native artifacts on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/audit-native-artifact.ps1 -Path target/native-acceptance
      - name: Audit JIT permissions on Unix
        if: runner.os != 'Windows'
        run: scripts/audit-jit-memory.sh '${{ matrix.executable }}'
      - name: Audit JIT permissions on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/audit-jit-memory.ps1 -Path '${{ matrix.executable }}'

  performance:
    name: performance (${{ matrix.arch }})
    env:
      CKC_V013_RUNTIME_BUNDLE: ${{ github.workspace }}/target/performance-runtime-replay-v013
      CKC_V012_RUNTIME_BUNDLE: ${{ github.workspace }}/target/performance-runtime-replay-v012
      CKC_V011_RUNTIME_BUNDLE: ${{ github.workspace }}/target/performance-runtime-replay-v011
      CKC_V010_RUNTIME_BUNDLE: ${{ github.workspace }}/target/performance-runtime-replay
      CKC_CANDIDATE_COMPILER: ${{ github.workspace }}/target/release/ckc
      CKC_V014_SCHEMA8_REPORT: ${{ github.workspace }}/target/ckc-perf/v0.13-results.json
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - arch: AArch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify exact checkout SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0
      - name: Bootstrap pinned performance oracle
        uses: ./.github/actions/bootstrap-ckc-llvm
        with:
          target: ${{ matrix.target }}
          profile: oracle
      - name: Build exact candidate compiler used by size and compile-time gates
        run: cargo build --release --features native-toolchain --locked
      - name: Audit pinned C, Rust, PGO, differential, and UB oracle contracts
        run: |
          python3 -B scripts/audit-performance-oracles.py
          python3 -B scripts/audit-performance-oracles.py --pgo
          python3 -B scripts/audit-performance-oracles.py --tune
      - name: Prepare independently built exact 0.12 compiler replay
        run: python3 scripts/prepare-performance-replay.py --baseline 0.12 --out "$CKC_V012_RUNTIME_BUNDLE"
      - name: Prepare independently built pinned 0.11 compiler replay
        run: python3 scripts/prepare-performance-replay.py --baseline 0.11 --out "$CKC_V011_RUNTIME_BUNDLE"
      - name: Prepare retained independently built pinned 0.10 compiler replay
        run: python3 scripts/prepare-performance-replay.py --baseline 0.10 --out "$CKC_V010_RUNTIME_BUNDLE"
      - name: Prepare exact 0.13 compiler and historical schema-8 replay
        run: python3 scripts/prepare-performance-replay.py --baseline 0.13 --with-performance --out "$CKC_V013_RUNTIME_BUNDLE"
      - name: Gate cumulative schema 7 and schema 8 on the same stable worker
        id: performance-gate
        run: |
          mkdir -p target/ckc-perf
          cargo bench --features native-toolchain --bench ckc_perf -- --case proof --task check --cpu baseline 2>&1 | tee target/ckc-perf/benchmark.log
          cp target/ckc-perf/results.json target/ckc-perf/results-baseline.json
          cargo bench --features native-toolchain --bench pgo_perf -- --task collect --candidate-version 0.14.0 --out target/ckc-perf/v0.13-results.json 2>&1 | tee target/ckc-perf/benchmark-schema8.log
          python3 scripts/check-native-performance.py --schema 8 --compat-candidate 0.14.0 --candidate-sha "$GITHUB_SHA" target/ckc-perf/v0.13-results.json 2>&1 | tee target/ckc-perf/checker-schema8.log
          cargo bench --features native-toolchain --bench tune_perf -- --task collect --out target/ckc-perf/v0.14-results.json 2>&1 | tee target/ckc-perf/benchmark-schema9.log
          python3 scripts/check-native-performance.py --schema 9 target/ckc-perf/v0.14-results.json 2>&1 | tee target/ckc-perf/checker-schema9.log
          cargo bench --features native-toolchain --bench tune_perf -- --task collect-predicated-update --out target/ckc-perf/v0.14-predicated-update-results.json 2>&1 | tee target/ckc-perf/benchmark-predicated-update.log
          python3 scripts/check-v014-predicated-update.py target/ckc-perf/v0.14-predicated-update-results.json --schema-nine target/ckc-perf/v0.14-results.json 2>&1 | tee target/ckc-perf/checker-predicated-update.log
      - name: Diagnose performance on the same worker without replacing the failed gate
        if: always() && (steps.performance-gate.outcome == 'failure' || inputs.performance_diagnostics == true)
        timeout-minutes: 20
        run: bash scripts/diagnose-native-performance.sh
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: performance-${{ matrix.arch }}
          path: |
            target/ckc-perf/
            target/performance-runtime-replay-v012/ckc-v012
            target/performance-runtime-replay-v012/ckc-v012-distribution.tar.gz
            target/performance-runtime-replay-v012/replay.tsv
            target/performance-runtime-replay-v012/preparation.log
            target/performance-runtime-replay-v013/ckc-v013
            target/performance-runtime-replay-v013/ckc-v013-distribution.tar.gz
            target/performance-runtime-replay-v013/replay.tsv
            target/performance-runtime-replay-v013/preparation.log
            target/performance-runtime-replay-v013/schema8/
            target/performance-runtime-replay-v013/check-native-performance-v013.py
            target/performance-runtime-replay-v011/ckc-v011
            target/performance-runtime-replay-v011/replay.tsv
            target/performance-runtime-replay-v011/preparation.log
            target/performance-runtime-replay-v011/*.so
            target/performance-runtime-replay/ckc-v010
            target/performance-runtime-replay/replay.tsv
            target/performance-runtime-replay/preparation.log
            target/performance-runtime-replay/*.so
            build/perf/latest.summary.json
            build/perf/latest.summary.md
            target/performance-diagnostics
            target/ckc-perf/v0.14-results.json
            target/ckc-perf/v014-measurement-*
            target/ckc-perf/v0.14-predicated-update-results.json
            target/ckc-perf/v014-predicated-update-*
          if-no-files-found: error
