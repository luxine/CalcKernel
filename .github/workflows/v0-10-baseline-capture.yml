name: Temporary v0.10 Baseline Capture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: capture (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - arch: AArch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: df816502876fba41676f9ebc190e4fadd18cd5a5
          path: baseline
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0
      - name: Bootstrap pinned performance oracle
        uses: ./.github/actions/bootstrap-ckc-llvm
        with:
          target: ${{ matrix.target }}
          profile: oracle
      - name: Add the immutable 0.11 proof corpus to the pinned 0.10 harness
        run: |
          cp benches/fixtures/proof_loop.ck baseline/benches/fixtures/proof_loop.ck
          cp tests/fixtures/performance/native/proof_loop.ck baseline/tests/fixtures/performance/native/proof_loop.ck
          printf 'proof\tbenches/fixtures/proof_loop.ck\n' >> baseline/benches/cases/native-cases.tsv
      - name: Measure the pinned 0.10 compiler
        working-directory: baseline
        run: cargo bench --features native-toolchain --bench ckc_perf -- --task check --cpu baseline
      - name: Render auditable TOML fragment
        working-directory: baseline
        run: |
          mkdir -p target/v0-10-baseline
          python3 - <<'PY' > target/v0-10-baseline/fragment.toml
          import json
          import platform
          from pathlib import Path

          arch = {"x86_64": "x86_64", "aarch64": "aarch64"}[platform.machine().lower()]
          target = f"linux-{arch}"
          runtime = json.loads(Path("target/ckc-perf/results.json").read_text())
          summary = json.loads(Path("build/perf/latest.summary.json").read_text())
          for suite in runtime["suites"]:
              for case in suite["cases"]:
                  print("[[runtime]]")
                  print(f'target = "{target}"')
                  print('cpu = "baseline"')
                  print(f'mode = "{suite["mode"]}"')
                  print(f'case = "{case["name"]}"')
                  print(f'median_ns = {case["nativeMedianNs"]}\n')
          for result in summary["results"]:
              if result["task"] != "check":
                  continue
              print("[[optimizer]]")
              print(f'target = "{target}"')
              print(f'case = "{result["case"]}"')
              print(f'median_ns = {result["medianNs"]}\n')
          PY
          cat target/v0-10-baseline/fragment.toml
      - name: Upload raw and rendered baseline evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v0-10-baseline-${{ matrix.arch }}
          path: |
            baseline/target/ckc-perf/results.json
            baseline/build/perf/latest.summary.json
            baseline/target/v0-10-baseline/fragment.toml
          if-no-files-found: error
