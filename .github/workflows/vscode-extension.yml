name: VS Code extension

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vscode-extension-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: VSIX (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            executable: target/release/ckc
          - target: darwin-x64
            runner: macos-15-intel
            executable: target/release/ckc
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            executable: target/release/ckc
          - target: linux-x64
            runner: ubuntu-24.04
            executable: target/release/ckc
          - target: win32-arm64
            runner: windows-11-arm
            executable: target/release/ckc.exe
          - target: win32-x64
            runner: windows-2025
            executable: target/release/ckc.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0

      - name: Activate the pinned pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --version
        working-directory: editors/vscode

      - name: Install extension dependencies
        run: pnpm install --frozen-lockfile
        working-directory: editors/vscode

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0

      - name: Build the frontend-only CK language server
        run: cargo build --release --locked --bin ckc
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}

      - name: Test extension and type-check
        run: |
          pnpm test
          pnpm typecheck
        working-directory: editors/vscode

      - name: Package platform VSIX
        run: pnpm package
        working-directory: editors/vscode

      - name: Smoke-test the extension in VS Code
        if: matrix.target == 'linux-x64'
        run: xvfb-run -a pnpm test:integration
        working-directory: editors/vscode
        env:
          CK_VSCODE_TEST_CKC: ${{ github.workspace }}/target/release/ckc

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: calckernel-vscode-${{ matrix.target }}
          path: editors/vscode/out/*.vsix
          if-no-files-found: error
