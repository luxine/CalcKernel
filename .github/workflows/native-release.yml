name: native ckc release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach artifacts to the matching GitHub Release"
        required: true
        default: false
        type: boolean
      candidate_ci:
        description: "Run the feature-branch candidate CI without publishing"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CKC_LLVM_SOURCE_SHA256: 922f1817a0df7b1489272d18134ee0087a8b068828f87ac63b9861b1a9965888

jobs:
  verify:
    if: inputs.candidate_ci != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Fetch annotated release tag object
        if: github.event_name == 'push' || inputs.publish == true
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          git fetch --no-tags origin
          "refs/tags/${RELEASE_TAG}:refs/release-validation/${RELEASE_TAG}"
      - name: Validate stable annotated release tag
        if: github.event_name == 'push' || inputs.publish == true
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/validate-release-tag.sh "${RELEASE_TAG}" "refs/release-validation/${RELEASE_TAG}" "${GITHUB_SHA}"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - name: Bootstrap pinned release oracle
        uses: ./.github/actions/bootstrap-ckc-llvm
        with:
          target: x86_64-unknown-linux-gnu
          profile: oracle
      - name: Verify release tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cargo_version="$(awk -F ' *= *' '/^version = / { gsub(/\"/, "", $2); print $2; exit }' Cargo.toml)"
          expected_tag="v${cargo_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "release tag ${GITHUB_REF_NAME} does not match Cargo version ${cargo_version}" >&2
            exit 1
          fi
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked
      - run: cargo build --release --features native-toolchain --locked
      - run: ./target/release/ckc --help

  candidate-ci:
    if: inputs.candidate_ci == true
    uses: ./.github/workflows/ci.yml

  build-artifacts:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            triple: aarch64-apple-darwin
            runner: macos-15
            binary: ckc-darwin-arm64
            archive: ckc-darwin-arm64.tar.gz
            executable: target/release/ckc
          - target: darwin-x64
            triple: x86_64-apple-darwin
            runner: macos-15-intel
            binary: ckc-darwin-x64
            archive: ckc-darwin-x64.tar.gz
            executable: target/release/ckc
          - target: linux-arm64
            triple: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            binary: ckc-linux-arm64
            archive: ckc-linux-arm64.tar.gz
            executable: target/release/ckc
          - target: linux-x64
            triple: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            binary: ckc-linux-x64
            archive: ckc-linux-x64.tar.gz
            executable: target/release/ckc
          - target: win32-arm64
            triple: aarch64-pc-windows-msvc
            runner: windows-11-arm
            binary: ckc-win32-arm64.exe
            archive: ckc-win32-arm64.zip
            executable: target/release/ckc.exe
          - target: win32-x64
            triple: x86_64-pc-windows-msvc
            runner: windows-2025
            binary: ckc-win32-x64.exe
            archive: ckc-win32-x64.zip
            executable: target/release/ckc.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0
      - name: Bootstrap target-minimal static LLVM ORC and LLD
        uses: ./.github/actions/bootstrap-ckc-llvm
        with:
          target: ${{ matrix.triple }}
          profile: release
      - name: Build native release compiler on Unix
        if: runner.os != 'Windows'
        run: cargo build --release --features native-toolchain --locked
      - name: Build native release compiler with static Windows CRT
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --features native-toolchain --locked
      - name: Sign the actual Darwin compiler before smoke tests and packaging
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - --options runtime \
            --entitlements native/macos/ckc-jit.entitlements.plist '${{ matrix.executable }}'
      - name: Record compiler identity and notices
        run: |
          '${{ matrix.executable }}' --help
          cargo_version="$(awk -F ' *= *' '/^version = / { gsub(/"/, "", $2); print $2; exit }' Cargo.toml)"
          verbose_identity="$('${{ matrix.executable }}' --version --verbose)"
          printf '%s\n' "${verbose_identity}"
          grep -Fqx "ckc ${cargo_version}" <<<"${verbose_identity}"
          grep -q '^Native ABI: 1$' <<<"${verbose_identity}"
          grep -q '^Runtime ABI: 2$' <<<"${verbose_identity}"
          grep -q '^LLVM: 22.1.8$' <<<"${verbose_identity}"
          '${{ matrix.executable }}' licenses
      - name: Functional run and build smoke
        run: |
          smoke_root="${RUNNER_TEMP}/ckc-release-smoke"
          mkdir -p "${smoke_root}"
          cat > "${smoke_root}/main.ck" <<'CK'
          fn main() -> i32 {
            print_i32(42);
            print_newline();
            return 0;
          }
          CK
          '${{ matrix.executable }}' run "${smoke_root}/main.ck" --no-cache > "${smoke_root}/run.stdout"
          test "$(cat "${smoke_root}/run.stdout")" = 42
          '${{ matrix.executable }}' build "${smoke_root}/main.ck" --kind executable --out "${smoke_root}/program"
          smoke_program="${smoke_root}/program"
          if [[ "${RUNNER_OS}" == Windows ]]; then smoke_program="${smoke_program}.exe"; fi
          PATH='' "${smoke_program}" > "${smoke_root}/build.stdout"
          test "$(cat "${smoke_root}/build.stdout")" = 42
      - name: Build native artifact audit fixtures
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo test --all-features --locked --test native artifacts
      - name: Audit compiler and generated artifacts on Unix
        if: runner.os != 'Windows'
        run: |
          scripts/audit-ckc-release.sh '${{ matrix.executable }}'
          scripts/audit-native-artifact.sh target/native-acceptance
          scripts/audit-jit-memory.sh '${{ matrix.executable }}'
      - name: Audit compiler and generated artifacts on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          scripts/audit-ckc-release.ps1 -Path '${{ matrix.executable }}'
          scripts/audit-native-artifact.ps1 -Path target/native-acceptance
          scripts/audit-jit-memory.ps1 -Path '${{ matrix.executable }}'
      - name: Create Unix release archive and checksum
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp '${{ matrix.executable }}' 'dist/${{ matrix.binary }}'
          tar -czf 'dist/${{ matrix.archive }}' -C dist '${{ matrix.binary }}'
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum '${{ matrix.archive }}' > '${{ matrix.archive }}.sha256'
            else
              shasum -a 256 '${{ matrix.archive }}' > '${{ matrix.archive }}.sha256'
            fi
          )
      - name: Create Windows release archive and checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath '${{ matrix.executable }}' -Destination 'dist/${{ matrix.binary }}'
          Compress-Archive -LiteralPath 'dist/${{ matrix.binary }}' -DestinationPath 'dist/${{ matrix.archive }}'
          $hash = (Get-FileHash -LiteralPath 'dist/${{ matrix.archive }}' -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText('dist/${{ matrix.archive }}.sha256', "$hash  ${{ matrix.archive }}`n", [Text.UTF8Encoding]::new($false))
      - name: Verify Unix release archive after extraction
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          readonly archive='dist/${{ matrix.archive }}'
          readonly checksum='dist/${{ matrix.archive }}.sha256'
          readonly expected_member='${{ matrix.binary }}'
          test "$(wc -l <"$checksum" | tr -d ' ')" -eq 1
          checksum_digest="$(awk 'NR == 1 { print $1 }' "$checksum")"
          [[ "$checksum_digest" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(cat "$checksum")" == "${checksum_digest}  ${{ matrix.archive }}" ]]
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum --check '${{ matrix.archive }}.sha256'
            else
              shasum -a 256 --check '${{ matrix.archive }}.sha256'
            fi
          )

          archive_members="$(tar -tzf "$archive")"
          [[ "$archive_members" == "$expected_member" ]]
          verify_root="$(mktemp -d "${RUNNER_TEMP}/ckc-archive-check.XXXXXX")"
          trap 'rm -rf -- "$verify_root"' EXIT
          tar -xzf "$archive" -C "$verify_root"
          unpacked="$verify_root/$expected_member"
          test -f "$unpacked" && test -x "$unpacked"
          cmp -s "$unpacked" '${{ matrix.executable }}'

          cargo_version="$(awk -F ' *= *' '/^version = / { gsub(/"/, "", $2); print $2; exit }' Cargo.toml)"
          verbose_identity="$("$unpacked" --version --verbose)"
          printf '%s\n' "$verbose_identity"
          grep -Fqx "ckc ${cargo_version}" <<<"$verbose_identity"
          grep -q '^Native ABI: 1$' <<<"$verbose_identity"
          grep -q '^Runtime ABI: 2$' <<<"$verbose_identity"
          grep -q '^LLVM: 22.1.8$' <<<"$verbose_identity"
          "$unpacked" licenses >"$verify_root/licenses.txt"
          grep -q '^===== LLVM Project 22\.1\.8' "$verify_root/licenses.txt"

          smoke_root="$verify_root/smoke"
          mkdir -p "$smoke_root"
          cat >"$smoke_root/main.ck" <<'CK'
          fn main() -> i32 {
            print_i32(42);
            print_newline();
            return 0;
          }
          CK
          "$unpacked" run "$smoke_root/main.ck" --no-cache >"$smoke_root/run.stdout"
          test "$(cat "$smoke_root/run.stdout")" = 42
          PATH='' "$unpacked" build "$smoke_root/main.ck" --kind executable --out "$smoke_root/program"
          smoke_program="$smoke_root/program"
          PATH='' "$smoke_program" >"$smoke_root/build.stdout"
          test "$(cat "$smoke_root/build.stdout")" = 42

          scripts/audit-ckc-release.sh "$unpacked"
          scripts/audit-jit-memory.sh "$unpacked"
      - name: Verify Windows release archive after extraction
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archiveName = '${{ matrix.archive }}'
          $memberName = '${{ matrix.binary }}'
          $archivePath = (Resolve-Path -LiteralPath "dist/$archiveName").Path
          $checksumPath = (Resolve-Path -LiteralPath "dist/$archiveName.sha256").Path
          $checksumText = [IO.File]::ReadAllText($checksumPath)
          $checksumPattern = '\A(?<digest>[0-9a-f]{64})  ' + [regex]::Escape($archiveName) + '\r?\n\z'
          $checksumMatch = [regex]::Match($checksumText, $checksumPattern)
          if (-not $checksumMatch.Success) {
            throw "Windows release archive checksum sidecar has an invalid format"
          }
          $expectedHash = $checksumMatch.Groups['digest'].Value
          $actualHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -cne $expectedHash) {
            throw "Windows release archive checksum verification failed"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
            $members = @($zip.Entries | ForEach-Object { $_.FullName })
          } finally {
            $zip.Dispose()
          }
          if ($members.Count -ne 1 -or $members[0] -cne $memberName) {
            throw "Windows release archive must contain only $memberName at the archive root"
          }

          $verifyRoot = Join-Path $env:RUNNER_TEMP ("ckc-archive-check-" + [Guid]::NewGuid().ToString("N"))
          [IO.Directory]::CreateDirectory($verifyRoot) | Out-Null
          try {
            Expand-Archive -LiteralPath $archivePath -DestinationPath $verifyRoot
            $files = @(Get-ChildItem -LiteralPath $verifyRoot -File -Recurse)
            if ($files.Count -ne 1 -or $files[0].Name -cne $memberName) {
              throw "Extracted Windows release archive has an unexpected member set"
            }
            $unpacked = $files[0].FullName
            $packedHash = (Get-FileHash -LiteralPath '${{ matrix.executable }}' -Algorithm SHA256).Hash
            $unpackedHash = (Get-FileHash -LiteralPath $unpacked -Algorithm SHA256).Hash
            if ((Get-Item -LiteralPath '${{ matrix.executable }}').Length -ne (Get-Item -LiteralPath $unpacked).Length -or
                $packedHash -cne $unpackedHash) {
              throw "Extracted compiler bytes differ from the audited target executable"
            }

            $versionLine = Select-String -LiteralPath Cargo.toml -Pattern '^version = "([^"]+)"$' | Select-Object -First 1
            $cargoVersion = $versionLine.Matches[0].Groups[1].Value
            $verboseIdentity = (& $unpacked --version --verbose) -join "`n"
            if ($LASTEXITCODE -ne 0 -or $verboseIdentity -notmatch "(?m)^ckc $([regex]::Escape($cargoVersion))$" -or
                $verboseIdentity -notmatch '(?m)^Native ABI: 1$' -or
                $verboseIdentity -notmatch '(?m)^Runtime ABI: 2$' -or
                $verboseIdentity -notmatch '(?m)^LLVM: 22\.1\.8$') {
              throw "Extracted compiler version or ABI identity check failed"
            }
            $licenses = (& $unpacked licenses) -join "`n"
            if ($LASTEXITCODE -ne 0 -or $licenses -notmatch '(?m)^===== LLVM Project 22\.1\.8') {
              throw "Extracted compiler licenses check failed"
            }

            $smokeRoot = Join-Path $verifyRoot "smoke"
            [IO.Directory]::CreateDirectory($smokeRoot) | Out-Null
            $source = Join-Path $smokeRoot "main.ck"
            $programBase = Join-Path $smokeRoot "program"
            $sourceText = @"
          fn main() -> i32 {
            print_i32(42);
            print_newline();
            return 0;
          }
          "@
            [IO.File]::WriteAllText($source, $sourceText, [Text.UTF8Encoding]::new($false))
            $runOutput = (& $unpacked run $source --no-cache) -join "`n"
            if ($LASTEXITCODE -ne 0 -or $runOutput.TrimEnd("`r", "`n") -ne "42") {
              throw "Extracted compiler run smoke failed"
            }

            $previousPath = $env:PATH
            try {
              $env:PATH = ""
              & $unpacked build $source --kind executable --out $programBase
              $buildStatus = $LASTEXITCODE
            } finally {
              $env:PATH = $previousPath
            }
            if ($buildStatus -ne 0) {
              throw "Extracted compiler build failed with an empty PATH"
            }
            $smokeProgram = "$programBase.exe"
            $previousPath = $env:PATH
            try {
              $env:PATH = ""
              $buildOutput = (& $smokeProgram) -join "`n"
              $programStatus = $LASTEXITCODE
            } finally {
              $env:PATH = $previousPath
            }
            if ($programStatus -ne 0 -or $buildOutput.TrimEnd("`r", "`n") -ne "42") {
              throw "Extracted compiler build output smoke failed with an empty PATH"
            }

            scripts/audit-ckc-release.ps1 -Path $unpacked
            if ($LASTEXITCODE -ne 0) { throw "Extracted compiler release audit failed" }
            scripts/audit-jit-memory.ps1 -Path $unpacked
            if ($LASTEXITCODE -ne 0) { throw "Extracted compiler JIT memory audit failed" }
          } finally {
            Remove-Item -LiteralPath $verifyRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-ckc-${{ matrix.target }}
          path: |
            dist/${{ matrix.archive }}
            dist/${{ matrix.archive }}.sha256
          if-no-files-found: error

  publish-release:
    needs: build-artifacts
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || inputs.publish == true)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-ckc-*
          path: release-artifacts
          merge-multiple: true
      - name: Verify complete release asset set
        run: |
          archive_count="$(find release-artifacts -maxdepth 1 -type f ! -name '*.sha256' | wc -l | tr -d ' ')"
          checksum_count="$(find release-artifacts -maxdepth 1 -type f -name '*.sha256' | wc -l | tr -d ' ')"
          test "${archive_count}" -eq 6
          test "${checksum_count}" -eq 6
          for checksum_file in release-artifacts/*.sha256; do
            (
              cd release-artifacts
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum -c "${checksum_file##*/}"
              else
                shasum -a 256 -c "${checksum_file##*/}"
              fi
            )
          done
      - name: Create immutable GitHub Release
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_REF_NAME} already exists; refusing to overwrite it" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" release-artifacts/* \
            --verify-tag \
            --title "CalcKernel ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
