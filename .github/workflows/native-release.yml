name: native ckc release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach artifacts to the matching GitHub Release"
        required: true
        default: false
        type: boolean
      capture_v010_baselines:
        description: "Temporary: capture pinned v0.10 Linux performance baselines"
        required: true
        default: false
        type: boolean
      candidate_ci:
        description: "Run the feature-branch candidate CI without publishing"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CKC_LLVM_SOURCE_SHA256: 922f1817a0df7b1489272d18134ee0087a8b068828f87ac63b9861b1a9965888

jobs:
  verify:
    if: inputs.capture_v010_baselines != true && inputs.candidate_ci != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - name: Bootstrap pinned release oracle
        uses: ./.github/actions/bootstrap-ckc-llvm
        with:
          target: x86_64-unknown-linux-gnu
          profile: oracle
      - name: Verify release tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cargo_version="$(awk -F ' *= *' '/^version = / { gsub(/\"/, "", $2); print $2; exit }' Cargo.toml)"
          expected_tag="v${cargo_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "release tag ${GITHUB_REF_NAME} does not match Cargo version ${cargo_version}" >&2
            exit 1
          fi
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked
      - run: cargo build --release --features native-toolchain --locked
      - run: ./target/release/ckc --help

  candidate-ci:
    if: inputs.candidate_ci == true
    uses: ./.github/workflows/ci.yml

  capture-v010-baselines:
    if: inputs.capture_v010_baselines == true
    name: capture v0.10 baseline (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - arch: AArch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: df816502876fba41676f9ebc190e4fadd18cd5a5
          path: baseline
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0
      - name: Bootstrap pinned performance oracle
        uses: ./.github/actions/bootstrap-ckc-llvm
        with:
          target: ${{ matrix.target }}
          profile: oracle
      - name: Add the immutable 0.11 proof corpus and pinned baseline adapters
        run: |
          test "$(git -C baseline rev-parse HEAD)" = df816502876fba41676f9ebc190e4fadd18cd5a5
          test "$(sha256sum benches/baselines/v0_10_proof_loop_harness.patch | cut -d' ' -f1)" = 316b64bf3e24ade271d870444bb66a85018c4dcb66229afce202da2d2b53af6e
          test "$(sha256sum benches/baselines/v0_10_mir_optimizer_harness.patch | cut -d' ' -f1)" = 828138f376472b177d8bbd1aa4f7888ed323ec03d098e21a74abcfce32a98d0b
          test "$(sha256sum benches/baselines/v0_10_linux_cpp_runtime_harness.patch | cut -d' ' -f1)" = 099305e8a9d5ff8d54e574b0fbd202a511f28a8543508f8c0ea06001704cdaff
          test "$(sha256sum benches/baselines/v0_10_clang_cpu_harness.patch | cut -d' ' -f1)" = f22d58f4e2712e792a5b933376fe3a81fa1bd44a4cdb39b2790359ab5a40c7f1
          git -C baseline apply --check ../benches/baselines/v0_10_linux_cpp_runtime_harness.patch
          git -C baseline apply ../benches/baselines/v0_10_linux_cpp_runtime_harness.patch
          git -C baseline apply --check ../benches/baselines/v0_10_clang_cpu_harness.patch
          git -C baseline apply ../benches/baselines/v0_10_clang_cpu_harness.patch
          git -C baseline apply --check ../benches/baselines/v0_10_mir_optimizer_harness.patch
          git -C baseline apply ../benches/baselines/v0_10_mir_optimizer_harness.patch
          git -C baseline apply --check ../benches/baselines/v0_10_proof_loop_harness.patch
          git -C baseline apply ../benches/baselines/v0_10_proof_loop_harness.patch
          cp benches/fixtures/proof_loop.ck baseline/benches/fixtures/proof_loop.ck
          cp tests/fixtures/performance/native/proof_loop.ck baseline/tests/fixtures/performance/native/proof_loop.ck
          printf 'proof\tbenches/fixtures/proof_loop.ck\n' >> baseline/benches/cases/native-cases.tsv
          git -C baseline diff --check
      - name: Measure the pinned 0.10 compiler
        working-directory: baseline
        run: cargo bench --features native-toolchain --bench ckc_perf -- --task check --cpu baseline
      - name: Render auditable TOML fragment
        working-directory: baseline
        run: |
          mkdir -p target/v0-10-baseline
          python3 - <<'PY' > target/v0-10-baseline/fragment.toml
          import json
          import platform
          from pathlib import Path

          arch = {"x86_64": "x86_64", "aarch64": "aarch64"}[platform.machine().lower()]
          target = f"linux-{arch}"
          runtime = json.loads(Path("target/ckc-perf/results.json").read_text())
          for suite in runtime["suites"]:
              for case in suite["cases"]:
                  print("[[runtime]]")
                  print(f'target = "{target}"')
                  print('cpu = "baseline"')
                  print(f'mode = "{suite["mode"]}"')
                  print(f'case = "{case["name"]}"')
                  print(f'median_ns = {case["nativeMedianNs"]}\n')
          optimizer = Path("target/ckc-perf/v0-10-mir-optimizer.tsv").read_text().splitlines()
          if not optimizer or optimizer[0] != "case\tmedian_ns":
              raise SystemExit("invalid v0.10 MIR optimizer timing header")
          for line in optimizer[1:]:
              case, median_ns = line.split("\t")
              print("[[optimizer]]")
              print(f'target = "{target}"')
              print(f'case = "{case}"')
              print(f'median_ns = {median_ns}\n')
          PY
          cat target/v0-10-baseline/fragment.toml
      - name: Upload raw and rendered baseline evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v0-10-baseline-${{ matrix.arch }}
          path: |
            baseline/target/ckc-perf/results.json
            baseline/target/ckc-perf/v0-10-mir-optimizer.tsv
            baseline/build/perf/latest.summary.json
            baseline/target/v0-10-baseline/fragment.toml
          if-no-files-found: error

  build-artifacts:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            triple: aarch64-apple-darwin
            runner: macos-15
            binary: ckc-darwin-arm64
            archive: ckc-darwin-arm64.tar.gz
            executable: target/release/ckc
          - target: darwin-x64
            triple: x86_64-apple-darwin
            runner: macos-15-intel
            binary: ckc-darwin-x64
            archive: ckc-darwin-x64.tar.gz
            executable: target/release/ckc
          - target: linux-arm64
            triple: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            binary: ckc-linux-arm64
            archive: ckc-linux-arm64.tar.gz
            executable: target/release/ckc
          - target: linux-x64
            triple: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            binary: ckc-linux-x64
            archive: ckc-linux-x64.tar.gz
            executable: target/release/ckc
          - target: win32-arm64
            triple: aarch64-pc-windows-msvc
            runner: windows-11-arm
            binary: ckc-win32-arm64.exe
            archive: ckc-win32-arm64.zip
            executable: target/release/ckc.exe
          - target: win32-x64
            triple: x86_64-pc-windows-msvc
            runner: windows-2025
            binary: ckc-win32-x64.exe
            archive: ckc-win32-x64.zip
            executable: target/release/ckc.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0
      - name: Bootstrap target-minimal static LLVM ORC and LLD
        uses: ./.github/actions/bootstrap-ckc-llvm
        with:
          target: ${{ matrix.triple }}
          profile: release
      - name: Build native release compiler on Unix
        if: runner.os != 'Windows'
        run: cargo build --release --features native-toolchain --locked
      - name: Build native release compiler with static Windows CRT
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --features native-toolchain --locked
      - name: Record compiler identity and notices
        run: |
          '${{ matrix.executable }}' --help
          verbose_identity="$('${{ matrix.executable }}' --version --verbose)"
          printf '%s\n' "${verbose_identity}"
          grep -q '^ckc 0.11.0$' <<<"${verbose_identity}"
          grep -q '^Native ABI: 1$' <<<"${verbose_identity}"
          grep -q '^Runtime ABI: 2$' <<<"${verbose_identity}"
          grep -q '^LLVM: 22.1.8$' <<<"${verbose_identity}"
          '${{ matrix.executable }}' licenses
      - name: Functional run and build smoke
        run: |
          smoke_root="${RUNNER_TEMP}/ckc-release-smoke"
          mkdir -p "${smoke_root}"
          cat > "${smoke_root}/main.ck" <<'CK'
          fn main() -> i32 {
            print_i32(42);
            print_newline();
            return 0;
          }
          CK
          '${{ matrix.executable }}' run "${smoke_root}/main.ck" --no-cache > "${smoke_root}/run.stdout"
          test "$(cat "${smoke_root}/run.stdout")" = 42
          '${{ matrix.executable }}' build "${smoke_root}/main.ck" --kind executable --out "${smoke_root}/program"
          smoke_program="${smoke_root}/program"
          if [[ "${RUNNER_OS}" == Windows ]]; then smoke_program="${smoke_program}.exe"; fi
          PATH='' "${smoke_program}" > "${smoke_root}/build.stdout"
          test "$(cat "${smoke_root}/build.stdout")" = 42
      - name: Build native artifact audit fixtures
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo test --all-features --locked --test native artifacts
      - name: Audit compiler and generated artifacts on Unix
        if: runner.os != 'Windows'
        run: |
          scripts/audit-ckc-release.sh '${{ matrix.executable }}'
          scripts/audit-native-artifact.sh target/native-acceptance
          scripts/audit-jit-memory.sh '${{ matrix.executable }}'
      - name: Audit compiler and generated artifacts on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          scripts/audit-ckc-release.ps1 -Path '${{ matrix.executable }}'
          scripts/audit-native-artifact.ps1 -Path target/native-acceptance
          scripts/audit-jit-memory.ps1 -Path '${{ matrix.executable }}'
      - name: Create Unix release archive and checksum
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp '${{ matrix.executable }}' 'dist/${{ matrix.binary }}'
          tar -czf 'dist/${{ matrix.archive }}' -C dist '${{ matrix.binary }}'
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum '${{ matrix.archive }}' > '${{ matrix.archive }}.sha256'
            else
              shasum -a 256 '${{ matrix.archive }}' > '${{ matrix.archive }}.sha256'
            fi
          )
      - name: Create Windows release archive and checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath '${{ matrix.executable }}' -Destination 'dist/${{ matrix.binary }}'
          Compress-Archive -LiteralPath 'dist/${{ matrix.binary }}' -DestinationPath 'dist/${{ matrix.archive }}'
          $hash = (Get-FileHash -LiteralPath 'dist/${{ matrix.archive }}' -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText('dist/${{ matrix.archive }}.sha256', "$hash  ${{ matrix.archive }}`n", [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-ckc-${{ matrix.target }}
          path: |
            dist/${{ matrix.archive }}
            dist/${{ matrix.archive }}.sha256
          if-no-files-found: error

  publish-release:
    needs: build-artifacts
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || inputs.publish == true)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-ckc-*
          path: release-artifacts
          merge-multiple: true
      - name: Verify complete release asset set
        run: |
          archive_count="$(find release-artifacts -maxdepth 1 -type f ! -name '*.sha256' | wc -l | tr -d ' ')"
          checksum_count="$(find release-artifacts -maxdepth 1 -type f -name '*.sha256' | wc -l | tr -d ' ')"
          test "${archive_count}" -eq 6
          test "${checksum_count}" -eq 6
          for checksum_file in release-artifacts/*.sha256; do
            (
              cd release-artifacts
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum -c "${checksum_file##*/}"
              else
                shasum -a 256 -c "${checksum_file##*/}"
              fi
            )
          done
      - name: Create immutable GitHub Release
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_REF_NAME} already exists; refusing to overwrite it" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" release-artifacts/* \
            --verify-tag \
            --title "CalcKernel ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
