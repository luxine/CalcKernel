name: native ckc release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach artifacts to the matching GitHub Release"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify release tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cargo_version="$(awk -F ' *= *' '/^version = / { gsub(/\"/, "", $2); print $2; exit }' Cargo.toml)"
          expected_tag="v${cargo_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "release tag ${GITHUB_REF_NAME} does not match Cargo version ${cargo_version}" >&2
            exit 1
          fi
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: ./target/release/ckc --help
      - run: |
          smoke_file="$(mktemp "${RUNNER_TEMP}/ckc-smoke.XXXXXX.ck")"
          cat > "${smoke_file}" <<'CK'
          export fn add(a: i32, b: i32) -> i32 {
            return a + b;
          }
          CK
          ./target/release/ckc check "${smoke_file}"
          ./target/release/ckc emit-mir "${smoke_file}" -O3

  build-artifacts:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            binary: ckc-darwin-arm64
            archive: ckc-darwin-arm64.tar.gz
            executable: target/release/ckc
          - target: darwin-x64
            runner: macos-15-intel
            binary: ckc-darwin-x64
            archive: ckc-darwin-x64.tar.gz
            executable: target/release/ckc
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            binary: ckc-linux-arm64
            archive: ckc-linux-arm64.tar.gz
            executable: target/release/ckc
          - target: linux-x64
            runner: ubuntu-24.04
            binary: ckc-linux-x64
            archive: ckc-linux-x64.tar.gz
            executable: target/release/ckc
          - target: win32-arm64
            runner: windows-11-arm
            binary: ckc-win32-arm64.exe
            archive: ckc-win32-arm64.zip
            executable: target/release/ckc.exe
          - target: win32-x64
            runner: windows-2025
            binary: ckc-win32-x64.exe
            archive: ckc-win32-x64.zip
            executable: target/release/ckc.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: ${{ matrix.executable }} --help
      - run: |
          smoke_file="$(mktemp "${RUNNER_TEMP}/ckc-smoke.XXXXXX.ck")"
          cat > "${smoke_file}" <<'CK'
          export fn add(a: i32, b: i32) -> i32 {
            return a + b;
          }
          CK
          "${{ matrix.executable }}" check "${smoke_file}"
          "${{ matrix.executable }}" emit-mir "${smoke_file}" -O3
      - run: |
          mkdir -p dist
          cp "${{ matrix.executable }}" "dist/${{ matrix.binary }}"
          if [[ "${{ matrix.archive }}" == *.zip ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/${{ matrix.binary }}' -DestinationPath 'dist/${{ matrix.archive }}' -Force"
          else
            tar -czf "dist/${{ matrix.archive }}" -C dist "${{ matrix.binary }}"
          fi
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
            else
              shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
            fi
          )
      - uses: actions/upload-artifact@v4
        with:
          name: native-ckc-${{ matrix.target }}
          path: |
            dist/${{ matrix.archive }}
            dist/${{ matrix.archive }}.sha256
          if-no-files-found: error

  publish-release:
    needs: build-artifacts
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || inputs.publish == true)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: native-ckc-*
          path: release-artifacts
          merge-multiple: true
      - name: Verify release assets
        run: |
          archive_count="$(find release-artifacts -maxdepth 1 -type f ! -name '*.sha256' | wc -l | tr -d ' ')"
          checksum_count="$(find release-artifacts -maxdepth 1 -type f -name '*.sha256' | wc -l | tr -d ' ')"
          test "${archive_count}" -eq 6
          test "${checksum_count}" -eq 6
          for checksum_file in release-artifacts/*.sha256; do
            (
              cd release-artifacts
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum -c "${checksum_file##*/}"
              else
                shasum -a 256 -c "${checksum_file##*/}"
              fi
            )
          done
      - name: Create immutable GitHub Release
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_REF_NAME} already exists; refusing to overwrite it" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" release-artifacts/* \
            --verify-tag \
            --title "CalcKernel ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
