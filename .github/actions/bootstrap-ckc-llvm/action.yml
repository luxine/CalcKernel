name: Bootstrap pinned CalcKernel LLVM
description: Restore or build the checksum-verified host LLVM/ORC/LLD prefix

inputs:
  target:
    description: Exact Rust host target triple
    required: true
  profile:
    description: release excludes Clang; oracle includes the pinned Clang oracle
    required: false
    default: release

outputs:
  prefix:
    description: Validated LLVM installation prefix
    value: ${{ steps.layout.outputs.prefix }}
  clang:
    description: Pinned Clang path for the oracle profile
    value: ${{ steps.layout.outputs.clang }}

runs:
  using: composite
  steps:
    - name: Derive manifest-addressed paths
      id: layout
      shell: pwsh
      env:
        CKC_BOOTSTRAP_TARGET: ${{ inputs.target }}
        CKC_BOOTSTRAP_PROFILE: ${{ inputs.profile }}
        CKC_BOOTSTRAP_RECIPE_DIGEST: ${{ hashFiles('native/llvm/manifest.toml', 'native/runtime/**/*.c', 'native/runtime/**/*.h', 'native/runtime/**/*.S', 'native/runtime/**/*.def', 'native/runtime/**/*.tbd', 'scripts/bootstrap-llvm.sh', 'scripts/bootstrap-llvm.ps1') }}
      run: |
        if ($env:CKC_BOOTSTRAP_PROFILE -notin @("release", "oracle")) {
          throw "unsupported LLVM bootstrap profile: $env:CKC_BOOTSTRAP_PROFILE"
        }
        $digest = $env:CKC_BOOTSTRAP_RECIPE_DIGEST
        if ($digest -notmatch '^[0-9a-f]{64}$') {
          throw "invalid LLVM bootstrap recipe digest: $digest"
        }
        $identity = "$env:CKC_BOOTSTRAP_TARGET-$($digest.Substring(0, 16))"
        $prefix = Join-Path $env:RUNNER_TEMP "ckc-llvm-prefix-$identity-release"
        $build = Join-Path $env:RUNNER_TEMP "ckc-llvm-build-$identity-release"
        $oraclePrefix = Join-Path $env:RUNNER_TEMP "ckc-llvm-prefix-$identity-oracle"
        $oracleBuild = Join-Path $env:RUNNER_TEMP "ckc-llvm-build-$identity-oracle"
        $archive = Join-Path $env:RUNNER_TEMP "llvm-project-22.1.8.src.tar.xz"
        $clangName = if ($env:RUNNER_OS -eq "Windows") { "clang.exe" } else { "clang" }
        $clang = Join-Path $oraclePrefix "bin/$clangName"
        "recipe-digest=$digest" >> $env:GITHUB_OUTPUT
        "prefix=$prefix" >> $env:GITHUB_OUTPUT
        "build=$build" >> $env:GITHUB_OUTPUT
        "oracle-prefix=$oraclePrefix" >> $env:GITHUB_OUTPUT
        "oracle-build=$oracleBuild" >> $env:GITHUB_OUTPUT
        "archive=$archive" >> $env:GITHUB_OUTPUT
        "clang=$clang" >> $env:GITHUB_OUTPUT

    - name: Restore manifest-addressed LLVM prefix
      id: cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ steps.layout.outputs.prefix }}
        key: ckc-llvm-v3-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-release-${{ steps.layout.outputs.recipe-digest }}

    - name: Restore manifest-addressed Clang oracle prefix
      id: oracle-cache
      if: inputs.profile == 'oracle'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ steps.layout.outputs.oracle-prefix }}
        key: ckc-llvm-v3-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-oracle-${{ steps.layout.outputs.recipe-digest }}

    - name: Download pinned LLVM source on Unix
      if: runner.os != 'Windows' && (steps.cache.outputs.cache-hit != 'true' || (inputs.profile == 'oracle' && steps.oracle-cache.outputs.cache-hit != 'true'))
      shell: bash
      run: |
        curl --fail --location --proto '=https' --tlsv1.2 --retry 5 \
          --output '${{ steps.layout.outputs.archive }}' \
          'https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/llvm-project-22.1.8.src.tar.xz'

    - name: Download pinned LLVM source on Windows
      if: runner.os == 'Windows' && (steps.cache.outputs.cache-hit != 'true' || (inputs.profile == 'oracle' && steps.oracle-cache.outputs.cache-hit != 'true'))
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/llvm-project-22.1.8.src.tar.xz" -OutFile "${{ steps.layout.outputs.archive }}"

    - name: Build pinned LLVM on Unix
      if: runner.os != 'Windows' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        scripts/bootstrap-llvm.sh \
          --archive '${{ steps.layout.outputs.archive }}' \
          --prefix '${{ steps.layout.outputs.prefix }}' \
          --build-dir '${{ steps.layout.outputs.build }}' \
          --target '${{ inputs.target }}' \
          --profile release

    - name: Build pinned LLVM on Windows
      if: runner.os == 'Windows' && steps.cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        scripts/bootstrap-llvm.ps1 -Archive "${{ steps.layout.outputs.archive }}" -Prefix "${{ steps.layout.outputs.prefix }}" -BuildDir "${{ steps.layout.outputs.build }}" -Target "${{ inputs.target }}" -Profile release

    - name: Validate cached or built prefix
      shell: pwsh
      run: |
        scripts/validate-llvm-prefix.ps1 -Prefix "${{ steps.layout.outputs.prefix }}" -Target "${{ inputs.target }}" -Profile release
        "CKC_LLVM_PREFIX=${{ steps.layout.outputs.prefix }}" >> $env:GITHUB_ENV

    - name: Save manifest-addressed LLVM prefix
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ steps.layout.outputs.prefix }}
        key: ckc-llvm-v3-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-release-${{ steps.layout.outputs.recipe-digest }}

    - name: Build pinned Clang oracle on Unix
      if: runner.os != 'Windows' && inputs.profile == 'oracle' && steps.oracle-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        scripts/bootstrap-llvm.sh \
          --archive '${{ steps.layout.outputs.archive }}' \
          --prefix '${{ steps.layout.outputs.oracle-prefix }}' \
          --build-dir '${{ steps.layout.outputs.oracle-build }}' \
          --target '${{ inputs.target }}' \
          --profile oracle

    - name: Build pinned Clang oracle on Windows
      if: runner.os == 'Windows' && inputs.profile == 'oracle' && steps.oracle-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        scripts/bootstrap-llvm.ps1 -Archive "${{ steps.layout.outputs.archive }}" -Prefix "${{ steps.layout.outputs.oracle-prefix }}" -BuildDir "${{ steps.layout.outputs.oracle-build }}" -Target "${{ inputs.target }}" -Profile oracle

    - name: Validate cached or built Clang oracle prefix
      if: inputs.profile == 'oracle'
      shell: pwsh
      run: |
        scripts/validate-llvm-prefix.ps1 -Prefix "${{ steps.layout.outputs.oracle-prefix }}" -Target "${{ inputs.target }}" -Profile oracle
        "CKC_CLANG_ORACLE=${{ steps.layout.outputs.clang }}" >> $env:GITHUB_ENV

    - name: Save manifest-addressed Clang oracle prefix
      if: inputs.profile == 'oracle' && steps.oracle-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ steps.layout.outputs.oracle-prefix }}
        key: ckc-llvm-v3-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-oracle-${{ steps.layout.outputs.recipe-digest }}
