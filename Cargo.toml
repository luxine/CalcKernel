[package]
name = "calckernel"
version = "0.13.0"
edition = "2024"
license = "MIT"
description = "Native compiler for the CK / CalcKernel computation language."
autobenches = false

[features]
default = []
native-toolchain = []

[lib]
name = "calckernel"
path = "src/lib.rs"

[[bin]]
name = "ckc"
path = "src/bin/ckc.rs"

[[bench]]
name = "ckc_perf"
path = "benches/ckc_perf.rs"
harness = false

[dependencies]
num-bigint = "0.4"
sha2 = "0.10"
thiserror = "2.0"
wat = "1.0"

[build-dependencies]
cc = "1.2"
sha2 = "0.10"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
