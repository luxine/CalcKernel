[package]
name = "calckernel"
version = "0.13.0"
edition = "2024"
license = "MIT"
description = "Native compiler for the CK / CalcKernel computation language."
repository = "https://github.com/luxine/CalcKernel"
autobenches = false

[features]
default = []
native-toolchain = []

[lib]
name = "calckernel"
path = "src/lib.rs"

[[bin]]
name = "ckc"
path = "src/bin/ckc.rs"

[[bench]]
name = "ckc_perf"
path = "benches/ckc_perf.rs"
harness = false

[[bench]]
name = "pgo_perf"
path = "benches/pgo_perf.rs"
harness = false

[dependencies]
libc = "0.2"
num-bigint = "0.4"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.8"
unicode-normalization = "0.1"
wat = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading"] }

[build-dependencies]
cc = "1.2"
sha2 = "0.10"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
